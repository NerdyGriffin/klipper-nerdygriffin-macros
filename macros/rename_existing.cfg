# G-Code Command Overrides and Custom Implementations
# Hardware-agnostic G-Code enhancements and Klipper convenience macros
# Part of klipper-nerdygriffin-macros
#
# This file provides:
# - Marlin-compatible aliases Klipper lacks: M0 / M226 (-> PAUSE), M205 (-> SET_VELOCITY_LIMIT)
# - Status-aware wrappers (rename_existing) for M18, M84, M109, M190,
#   SET_HEATER_TEMPERATURE and TURN_OFF_HEATERS that drive STATUS_* and the display
# - M117 override that echoes the message to the console (rawparams, comment-trimmed)
# - SET_DISPLAY_TEXT override that cancels any pending clear_display before setting text
#
# Requires:
# - status_macros.cfg (STATUS_*, RESET_STATUS, clear_display) - called unconditionally
# - [display_status] for the SET_DISPLAY_TEXT override (provided by mainsail.cfg/fluidd.cfg)
# - [pause_resume] for M0 / M226 (provided by mainsail.cfg/fluidd.cfg)
# Originals stay reachable as M18.1, M84.1, M109.1, M190.1, M117.1,
# _SET_HEATER_TEMPERATURE, _TURN_OFF_HEATERS and _SET_DISPLAY_TEXT.

#####################################################################
#   Implement less common G-Code commands
#####################################################################

[gcode_macro M0]
gcode: PAUSE

[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro M226]
gcode: PAUSE

