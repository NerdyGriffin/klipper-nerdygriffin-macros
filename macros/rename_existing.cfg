#####################################################################
#   Override existing commands to automatically update status
#####################################################################

[gcode_macro M18]
rename_existing: M18.1
gcode:
    M18.1 {rawparams}
    M117 Turn off motors
    STATUS_OFF

[gcode_macro M84]
rename_existing: M84.1
gcode:
    M84.1 {rawparams}
    M117 Turn off motors
    STATUS_OFF

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set s = params.S|float %}
    STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Extruder: {s}C"
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}
    RESET_STATUS BEEP=0

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set s = params.S|float %}
    STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Bed: {s}C"
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}
    RESET_STATUS BEEP=0

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
    {% set HEATER = params.HEATER %}
    {% set TARGET = params.TARGET %}

    STATUS_HEATING

    {% if 'extruder' in HEATER %}
        SET_DISPLAY_TEXT MSG="Extruder: {TARGET}C"
    {% elif 'heater_bed' in HEATER %}
        SET_DISPLAY_TEXT MSG="Bed: {TARGET}C"
    {% else %}
        SET_DISPLAY_TEXT MSG="{HEATER}: {TARGET}C"
    {% endif %}

    _SET_HEATER_TEMPERATURE {rawparams}

    {% if printer.idle_timeout.state|upper == "PRINTING" %}
        STATUS_PRINTING
    {% else %}
        UPDATE_DELAYED_GCODE ID=clear_display DURATION=120
    {% endif %}

[gcode_macro TURN_OFF_HEATERS]
rename_existing: _TURN_OFF_HEATERS
gcode:
    _TURN_OFF_HEATERS {rawparams}
    STATUS_READY

    # # The following UPDATE_DELAYED_GCODE causes infinite loop
    # # because the execution of notify_bed_cooled brings the printer out of the idle state,
    # # and then the idle_timeout triggers TURN_OFF_HEATERS when the printer returns to idle,
    # # which then call the delayed_gcode below, thus restarting the cycle
    # UPDATE_DELAYED_GCODE ID=notify_bed_cooled DURATION=10

######################################################################
# Override M117 command with rawparams
######################################################################

# The macro below will override the default M117 command to echo the message.
#
# It uses the rawparams pseudo-variable that contains the full unparsed
# parameters that was passed to the M117 command.
#
# As this can include comments, we are trimming the text when a `;` or `#` is
# found, and escaping any existing `"`

[gcode_macro M117]
rename_existing: M117.1
gcode:
  {% if rawparams %}
    {% set escaped_msg = rawparams.split(';', 1)[0].split('\x23', 1)[0]|replace('"', '\\"') %}
    SET_DISPLAY_TEXT MSG="{escaped_msg}"
    RESPOND TYPE=command MSG="{escaped_msg}"
  {% else %}
    SET_DISPLAY_TEXT
  {% endif %}


######################################################################
# Override SET_DISPLAY_TEXT to cancel any pending clear_display
######################################################################

[gcode_macro SET_DISPLAY_TEXT]
rename_existing: _SET_DISPLAY_TEXT
gcode:
  UPDATE_DELAYED_GCODE ID=clear_display DURATION=0
  _SET_DISPLAY_TEXT {rawparams}
