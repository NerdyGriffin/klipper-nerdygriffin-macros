# BTT SFS V2.0 filament switch + motion sensor pair
# The switch only reports; the encoder pauses on a jam only while the switch still sees filament
# Part of klipper-nerdygriffin-macros
# - Requires [include filament_management.cfg] in printer.cfg (_PAUSE_IF_PRINTING)
# - Requires [include status_macros.cfg] in printer.cfg (RESET_STATUS)
# - switch_pin of both sections must be set in your overrides file, included after this one
[filament_switch_sensor switch_sensor]
pause_on_runout: False
runout_gcode:
    M117 Filament runout (switch)
    RESET_STATUS
insert_gcode:
    M117 Filament inserted (switch)

[filament_motion_sensor encoder_sensor]
detection_length: 20 ; BTT default is 2.88; 10+ avoids flow-dropoff false triggers
extruder: extruder
pause_on_runout: False ; runout_gcode decides whether to pause
runout_gcode:
    {% if printer["filament_switch_sensor switch_sensor"].filament_detected %}
        _PAUSE_IF_PRINTING
        M117 Filament jam or underextrusion (encoder)
    {% else %}
        M117 Filament runout (encoder)
    {% endif %}
insert_gcode:
    M117 Filament inserted (encoder)
