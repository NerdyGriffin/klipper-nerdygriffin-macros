# Nevermore vent servo policy
# Part of klipper-nerdygriffin-macros
# - Requires a [nevermore] section (https://github.com/SanaaHamel/nevermore-controller); every macro is a no-op without one
# - Fan control stays with the controller (print mode, automatic VOC policy, cooldown); this file only decides the vent position
# - Vent opens when the chamber is above its target by `margin` and the VOC index is below `voc_vent_max`; closes otherwise
# - NEVERMORE_VENT_AUTO CHAMBER=<target> starts the poll (PRINT_START); POST_PRINT=1 lowers the target to `post_print_target` (PRINT_END)
# - Supports per-printer overrides via [gcode_macro _NEVERMORE_VARS] variables in printer.cfg

[gcode_macro _NEVERMORE_VARS]
description: Vent policy settings and runtime state
variable_voc_vent_max: 150          # VOC index (0-500, 100 = baseline); vent never opens at or above this
variable_margin: 3                  # Hysteresis around the chamber target (C)
variable_poll_interval: 30          # Seconds between policy evaluations
variable_post_print_target: 25      # Chamber target after PRINT_END (C); polling stops once reached
variable_post_print_timeout: 60     # Minutes before post-print polling gives up
variable_vent_open_percent: 0       # NEVERMORE_VENT_SERVO_SET PERCENT for open
variable_vent_closed_percent: 1     # NEVERMORE_VENT_SERVO_SET PERCENT for closed
variable_target_chamber: 0          # Runtime: current chamber target
variable_vent_open: False           # Runtime: last commanded vent position
variable_post_print: False          # Runtime: post-print mode
variable_polls_remaining: 0         # Runtime: post-print timeout countdown (0 = unlimited)
gcode:

[gcode_macro NEVERMORE_OPEN_VENT]
description: Open the Nevermore vent servo
gcode:
    {% if 'nevermore' in printer %}
        {% set V = printer['gcode_macro _NEVERMORE_VARS'] %}
        M117 Opening Nevermore vent...
        NEVERMORE_VENT_SERVO_SET PERCENT={V.vent_open_percent} HOLD_FOR=1
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=vent_open VALUE=True
    {% endif %}

[gcode_macro NEVERMORE_CLOSE_VENT]
description: Close the Nevermore vent servo
gcode:
    {% if 'nevermore' in printer %}
        {% set V = printer['gcode_macro _NEVERMORE_VARS'] %}
        M117 Closing Nevermore vent...
        NEVERMORE_VENT_SERVO_SET PERCENT={V.vent_closed_percent} HOLD_FOR=1
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=vent_open VALUE=False
    {% endif %}

[gcode_macro NEVERMORE_VENT_AUTO]
description: Start automatic vent control. CHAMBER=<target C> during a print, POST_PRINT=1 after it
gcode:
    {% if 'nevermore' in printer %}
        {% set V = printer['gcode_macro _NEVERMORE_VARS'] %}
        {% set post_print = params.POST_PRINT|default(0)|int == 1 %}
        {% set target = V.post_print_target if post_print else params.CHAMBER|default(V.target_chamber)|float %}
        {% set polls = (V.post_print_timeout * 60 / V.poll_interval)|int if post_print else 0 %}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=target_chamber VALUE={target}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=post_print VALUE={post_print}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=polls_remaining VALUE={polls}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION=1
    {% endif %}

[gcode_macro NEVERMORE_VENT_AUTO_OFF]
description: Stop automatic vent control, leaving the vent where it is
gcode:
    {% if 'nevermore' in printer %}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION=0
    {% endif %}

[delayed_gcode _NEVERMORE_VENT_POLL]
initial_duration: 0
gcode:
    {% set V = printer['gcode_macro _NEVERMORE_VARS'] %}
    {% set nm = printer.nevermore|default({}) %}
    {% set temp = nm.intake_temperature|default(nm.exhaust_temperature|default(none)) %}
    {% set voc = [nm.intake_gas|default(0), nm.exhaust_gas|default(0)]|max %}
    {% set stop = false %}
    {% if nm.connected|default(false) and temp is not none %}
        {% if V.vent_open %}
            {% if voc >= V.voc_vent_max or temp < V.target_chamber - V.margin %}
                NEVERMORE_CLOSE_VENT
            {% endif %}
        {% elif voc < V.voc_vent_max and temp > V.target_chamber + V.margin %}
            NEVERMORE_OPEN_VENT
        {% endif %}
        {% if V.post_print and temp <= V.target_chamber %}
            {% set stop = true %}
        {% endif %}
    {% endif %}
    {% if V.post_print and V.polls_remaining > 0 %}
        {% if V.polls_remaining == 1 %}
            {% set stop = true %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=polls_remaining VALUE={V.polls_remaining - 1}
    {% endif %}
    {% if stop %}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=post_print VALUE=False
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION=0
    {% else %}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION={V.poll_interval}
    {% endif %}
