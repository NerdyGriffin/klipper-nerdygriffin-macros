# Nevermore vent servo policy
# Part of klipper-nerdygriffin-macros
# - Requires a [nevermore] section (https://github.com/SanaaHamel/nevermore-controller); every macro is a no-op without one
# - Fan control stays with the controller (print mode, automatic VOC policy, cooldown); this file only decides the vent position
# - During a print the vent position is proportional to how far the intake (chamber) temperature is above its target: closed at or below the target, fully open `255 / kp` C above it; the VOC index is ignored
# - `kp` uses Klipper's PID scaling (`kp / 255` = vent opening per C); with `kp: 0` the vent instead opens above the target by `temp_max_delta` and closes below it by `temp_max_delta`
# - At idle (target 0) the vent closes when the exhaust VOC index reaches `voc_vent_max` and reopens below `voc_vent_max - voc_max_delta`; temperature is ignored
# - The poll starts at boot (`auto_start`) with a target of 0, so the vent stays open at idle unless the air is dirty
# - NEVERMORE_VENT_AUTO CHAMBER=<target> sets the target (PRINT_START, M141 S<target>); CHAMBER=0 returns to the idle policy (PRINT_END, M141 S0)
# - The first poll after a restart always commands the vent, since the controller reports no servo position
# - Supports per-printer overrides via [gcode_macro _NEVERMORE_VARS] variables in printer.cfg

[gcode_macro _NEVERMORE_VARS]
description: Vent policy settings and runtime state
variable_voc_vent_max: 250          # VOC index (0-500, 100 = baseline); at idle the vent never opens at or above this
variable_voc_max_delta: 5           # Hysteresis below voc_vent_max (VOC index points)
variable_kp: 50                     # Proportional gain during a print (Klipper PID scaling; fully open 255 / kp C above target); 0 = open/closed with `temp_max_delta`
variable_min_step: 0.01             # Smallest change in vent position (0-1) worth moving the servo for
variable_temp_max_delta: 2.0        # Hysteresis around the chamber target (C); only used with kp: 0
variable_poll_interval: 30          # Seconds between policy evaluations
variable_auto_start: True           # Start automatic control at boot
variable_vent_open_percent: 0       # NEVERMORE_VENT_SERVO_SET PERCENT for open
variable_vent_closed_percent: 1     # NEVERMORE_VENT_SERVO_SET PERCENT for closed
variable_target_chamber: 0          # Runtime: current chamber target
variable_vent_position: None        # Runtime: last commanded vent position, 0 closed - 1 open (None = unknown)
variable_vent_open: None            # Runtime: vent_position > 0 (None = unknown)
gcode:

[gcode_macro NEVERMORE_SET_VENT]
description: Move the Nevermore vent servo. POSITION=<0 closed - 1 open>
gcode:
    {% if 'nevermore' in printer %}
        {% set V = printer['gcode_macro _NEVERMORE_VARS'] %}
        {% set pos = ([[params.POSITION|default(0)|float, 0]|max, 1]|min)|round(2) %}
        {% set percent = V.vent_closed_percent + pos * (V.vent_open_percent - V.vent_closed_percent) %}
        {% if pos >= 1 %}
            M117 Opening Nevermore vent...
        {% elif pos <= 0 %}
            M117 Closing Nevermore vent...
        {% else %}
            M117 Nevermore vent {(pos * 100)|round|int}%
        {% endif %}
        NEVERMORE_VENT_SERVO_SET PERCENT={percent|round(3)} HOLD_FOR=1
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=vent_position VALUE={pos}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=vent_open VALUE={pos > 0}
    {% endif %}

[gcode_macro NEVERMORE_OPEN_VENT]
description: Open the Nevermore vent servo
gcode:
    NEVERMORE_SET_VENT POSITION=1

[gcode_macro NEVERMORE_CLOSE_VENT]
description: Close the Nevermore vent servo
gcode:
    NEVERMORE_SET_VENT POSITION=0

[gcode_macro NEVERMORE_VENT_AUTO]
description: Start automatic vent control. CHAMBER=<target C> during a print, CHAMBER=0 (default) for idle
gcode:
    {% if 'nevermore' in printer %}
        {% set target = params.CHAMBER|default(0)|float %}
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=target_chamber VALUE={target}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION=1
    {% endif %}

[gcode_macro NEVERMORE_VENT_AUTO_OFF]
description: Stop automatic vent control, leaving the vent where it is
gcode:
    {% if 'nevermore' in printer %}
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION=0
    {% endif %}

[delayed_gcode _NEVERMORE_VENT_STARTUP]
initial_duration: 1
gcode:
    {% if 'nevermore' in printer and printer['gcode_macro _NEVERMORE_VARS'].auto_start %}
        NEVERMORE_VENT_AUTO
    {% endif %}

[delayed_gcode _NEVERMORE_VENT_POLL]
initial_duration: 0
gcode:
    {% set V = printer['gcode_macro _NEVERMORE_VARS'] %}
    {% set nm = printer.nevermore|default({}) %}
    {% set temp = nm.intake_temperature|default(nm.exhaust_temperature|default(none)) %}
    {% set voc = nm.exhaust_gas|default(nm.intake_gas|default(0)) %}
    {% if nm.connected|default(false) and temp is not none %}
        {% set pos = V.vent_position %}
        {% set want = pos %}
        {% if V.target_chamber > 0 and V.kp > 0 %}
            {% set want = ([[V.kp * (temp - V.target_chamber) / 255, 0]|max, 1]|min)|round(2) %}
            {% if pos is not none and 0 < want < 1 and (want - pos)|abs < V.min_step %}
                {% set want = pos %}
            {% endif %}
        {% else %}
            {% if V.target_chamber <= 0 %}
                {% set want_open = voc < V.voc_vent_max - V.voc_max_delta %}
                {% set want_closed = voc >= V.voc_vent_max %}
            {% else %}
                {% set want_open = temp > V.target_chamber + V.temp_max_delta %}
                {% set want_closed = temp < V.target_chamber - V.temp_max_delta %}
            {% endif %}
            {% if pos is none %}
                {% set want = 1 if want_open else 0 %}
            {% elif want_closed and pos > 0 %}
                {% set want = 0 %}
            {% elif want_open and pos < 1 %}
                {% set want = 1 %}
            {% endif %}
        {% endif %}
        {% if want != pos %}
            NEVERMORE_SET_VENT POSITION={want}
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_NEVERMORE_VENT_POLL DURATION={V.poll_interval}
