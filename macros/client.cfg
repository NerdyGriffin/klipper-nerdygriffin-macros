# Mainsail/Fluidd client customization macros
# These hook into the pause/resume/cancel workflow provided by mainsail.cfg or fluidd.cfg
# Hardware-agnostic implementation with AFC support
# Part of klipper-nerdygriffin-macros
# - Requires [include beeper.cfg] in printer.cfg (M300 chimes)
# - Optional: reads standby_extruder from print_macros.cfg (PRINT_START); falls back to 150
# - Optional: detects AFC (AFC_BRUSH / AFC_PARK) if present
# NOTE: defines the NOZZLE_STANDBY_COOLDOWN delayed_gcode that idle_timeout.cfg optionally cancels

# Configure client macro hooks for Mainsail/Fluidd
[gcode_macro _CLIENT_VARIABLE]
variable_park_at_cancel   : True
variable_user_pause_macro : "_AFTER_PAUSE"
variable_user_resume_macro: "_BEFORE_RESUME"
variable_user_cancel_macro: "_BEFORE_CANCEL"
gcode:

# NOTE: Configure [gcode_macro _CLIENT_VARIABLE] in your printer.cfg
# to override Mainsail/Fluidd defaults. See mainsail.cfg for available options.
# Set user_pause_macro, user_resume_macro, and user_cancel_macro to use
# the macros below for AFC integration and filament sensor management.

[gcode_macro _AFTER_PAUSE]
gcode:
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    M300 S880 P200
    M300 S660 P250
    M300 S440 P300
    # Use AFC operations if available
    {% if printer['gcode_macro AFC_BRUSH'] is defined %}
        AFC_BRUSH
    {% endif %}
    {% if printer['gcode_macro AFC_PARK'] is defined %}
        AFC_PARK
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        # Drop the hotend to standby if the pause becomes prolonged. Fire ~30s before the
        # normal idle_timeout so this wins deterministically (see NOZZLE_STANDBY_COOLDOWN).
        UPDATE_DELAYED_GCODE ID=NOZZLE_STANDBY_COOLDOWN DURATION={[printer.configfile.settings.idle_timeout.timeout|int - 30, 60]|max}
    {% else %}
        # PAUSE was issued with no virtual_sdcard job running (e.g. a filament sensor
        # runout while idle). Stock PAUSE still sets `pause_resume.is_paused`, which would
        # leak into the next print, so clear it here. RESUME will never run after this,
        # so also undo the idle_timeout change stock PAUSE made (if _CLIENT_VARIABLE
        # idle_timeout > 0); RESUME normally restores it from restore_idle_timeout.
        CLEAR_PAUSE
        {% set restore_idle_timeout = printer['gcode_macro RESUME'].restore_idle_timeout|default(0)|int %}
        {% if restore_idle_timeout > 0 %}
            SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE=0
        {% endif %}
        RESPOND TYPE=echo MSG="Pause cleared: no active print"
        UPDATE_DELAYED_GCODE ID=clear_display DURATION=1
    {% endif %}

[gcode_macro _BEFORE_RESUME]
gcode:
    # Use AFC operations if available
    {% if printer['gcode_macro AFC_BRUSH'] is defined %}
        AFC_BRUSH
    {% endif %}
    {% if printer['gcode_macro AFC_PARK'] is defined %}
        AFC_PARK
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    UPDATE_DELAYED_GCODE ID=ENABLE_ENCODER_SENSOR DURATION=10
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=1
    # Cancel any pending standby cooldown; stock RESUME reheats via idle_state if it already fired
    UPDATE_DELAYED_GCODE ID=NOZZLE_STANDBY_COOLDOWN DURATION=0

[gcode_macro _BEFORE_CANCEL]
gcode:
    # Use AFC operations if available
    {% if printer['gcode_macro AFC_BRUSH'] is defined %}
        AFC_BRUSH
    {% endif %}
    {% if printer['gcode_macro AFC_PARK'] is defined %}
        AFC_PARK
    {% endif %}
    SET_GCODE_OFFSET Z=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    _ALERT_SOUND
    # Cancel any pending standby cooldown and clear the reheat flag so it can't leak into a later resume
    UPDATE_DELAYED_GCODE ID=NOZZLE_STANDBY_COOLDOWN DURATION=0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False

#####################################################################
#   Prolonged-pause hotend standby
#####################################################################

# Armed by _AFTER_PAUSE on every pause of a running virtual_sdcard print (print_stats
# state "printing"/"paused"); an idle-time PAUSE is cleared instead. When the pause outlasts the normal idle
# timeout, drop the hotend to the standby temperature instead of leaving it at full
# print temp (which cooks the filament parked in the nozzle). This matters most on
# AFC error pauses, where AFC extends idle_timeout to error_timeout (10 h) so the
# stock idle_timeout would not otherwise cool the hotend for hours.
#
# The pre-pause target is preserved in RESUME.last_extruder_temp (captured by stock
# PAUSE); setting RESUME idle_state=True forces stock RESUME to reheat to it before
# resuming. AFC/nerdygriffin LOAD/UNLOAD also reheat from standby on their own.
[delayed_gcode NOZZLE_STANDBY_COOLDOWN]
gcode:
    UPDATE_DELAYED_GCODE ID=NOZZLE_STANDBY_COOLDOWN DURATION=0     # self-cancel (one-shot)
    {% set standby = printer['gcode_macro PRINT_START'].standby_extruder|default(150)|int %}
    {% if printer.pause_resume.is_paused %}
        {% set cur_target = printer[printer.toolhead.extruder].target|int %}
        {% if cur_target > standby %}
            RESPOND MSG="Prolonged pause: hotend -> standby {standby}C (restores on RESUME)"
            M104 S{standby}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True   # force reheat on RESUME
        {% endif %}
    {% endif %}
