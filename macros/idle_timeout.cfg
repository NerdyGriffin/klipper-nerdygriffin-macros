# idle_timeout — cool the hotend and park (or fully shut down) when the printer goes idle
# Modified to not disable steppers (M84) on idle
# Part of klipper-nerdygriffin-macros
# - Requires [include status_macros.cfg] in printer.cfg (STATUS_OFF)
# - Optional: cancels client.cfg's NOZZLE_STANDBY_COOLDOWN standby timer if that file is included
# - Optional: detects AFC (AFC_BRUSH / AFC_PARK) if present

[idle_timeout]
gcode:
    # If client.cfg's prolonged-pause standby feature is present, cancel its pending timer so
    # idle_timeout stays authoritative. delayed_gcode objects have no get_status and cannot be
    # probed with `is defined`, so guard on the owning macro (_AFTER_PAUSE) from the same file.
    {% if printer['gcode_macro _AFTER_PAUSE'] is defined %}
        UPDATE_DELAYED_GCODE ID=NOZZLE_STANDBY_COOLDOWN DURATION=0 # idle_timeout takes over; no late standby re-heat
    {% endif %}
    M104 S0 # Turn off extruder, keep bed on
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    {% if printer.pause_resume.is_paused or printer.virtual_sdcard.is_active %}
        {% if "xyz" in printer.toolhead.homed_axes %}
            {% if printer['gcode_macro AFC_BRUSH'] is defined %}
                AFC_BRUSH
            {% endif %}
            {% if printer['gcode_macro AFC_PARK'] is defined %}
                AFC_PARK
            {% endif %}
        {% endif %}
    {% else %}
        TURN_OFF_HEATERS
        STATUS_OFF
        G92 E0
        M84
    {% endif %}
timeout: 1800
